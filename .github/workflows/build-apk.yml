name: Build APK (Release)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # admin_desktop ikut dibangun sebagai APK agar bisa dipakai dari HP
        # (tidak semua pengelola punya laptop/desktop).
        app: [mobile_wali, mobile_bendahara, mobile_guru, mobile_kepala, admin_desktop]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install melos
        run: dart pub global activate melos 6.3.2

      - name: Bootstrap workspace
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          melos bootstrap

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.APP_KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > apps/${{ matrix.app }}/android/app/key.jks
            echo "storePassword=$KEYSTORE_PASS" > apps/${{ matrix.app }}/android/key.properties
            echo "keyPassword=$KEYSTORE_PASS" >> apps/${{ matrix.app }}/android/key.properties
            echo "keyAlias=${{ matrix.app }}-key" >> apps/${{ matrix.app }}/android/key.properties
            echo "storeFile=key.jks" >> apps/${{ matrix.app }}/android/key.properties
            echo "✓ Keystore decoded"
          else
            echo "⚠ No keystore secret — using debug signing"
          fi

      - name: Restore / verify google-services.json
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_BASE64 }}
        run: |
          APP_DIR="apps/${{ matrix.app }}/android/app"
          # admin_desktop tidak memakai Firebase (tidak ada FCM), jadi
          # google-services.json memang tidak diperlukan.
          if [ "${{ matrix.app }}" = "admin_desktop" ]; then
            echo "✓ admin_desktop: Firebase tidak dipakai, dilewati"
            # 'exit 0' menghentikan langkah ini dengan sukses; langkah
            # berikutnya tetap berjalan karena tiap step terpisah.
            exit 0
          fi
          if [ -f "$APP_DIR/google-services.json" ]; then
            echo "✓ google-services.json ditemukan (ter-commit di repo)"
          elif [ -n "$GOOGLE_SERVICES_BASE64" ]; then
            echo "$GOOGLE_SERVICES_BASE64" | base64 -d > "$APP_DIR/google-services.json"
            echo "✓ google-services.json dipulihkan dari secret"
          else
            echo "::error::google-services.json TIDAK ADA untuk ${{ matrix.app }} dan secret GOOGLE_SERVICES_BASE64 kosong."
            echo "::error::Plugin com.google.gms.google-services akan gagal saat build."
            exit 1
          fi

      - name: Build APK
        run: |
          cd apps/${{ matrix.app }}
          flutter build apk --release

      - name: Verify launcher icon ter-bundle di APK
        run: |
          APK=apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
          ls -lh "$APK"

          # aapt (build-tools) membaca AndroidManifest hasil kompilasi —
          # inilah sumber kebenaran untuk ikon yang benar-benar dipakai
          # launcher, bukan sekadar file PNG yang ikut ter-zip.
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | sort -V | tail -1 || true)

          if [ -n "$AAPT" ] && [ -x "$AAPT" ]; then
            echo "=== badging (aapt) ==="
            "$AAPT" dump badging "$APK" > badging.txt 2>/dev/null || true
            grep -E "^application:|^application-icon" badging.txt || true
            echo "=== label ==="
            grep -oE "application-label:'[^']*'" badging.txt || true

            if ! grep -qE "^application:.*icon='res/" badging.txt; then
              echo "::error::${{ matrix.app }}: application icon tidak ter-set di manifest hasil build"
              exit 1
            fi
            ICONS=$(grep -c "^application-icon-" badging.txt || true)
            echo "Jumlah density icon: $ICONS"
            if [ "$ICONS" -lt 3 ]; then
              echo "::error::${{ matrix.app }}: hanya $ICONS density icon, seharusnya >= 5"
              exit 1
            fi
          else
            echo "::warning::aapt tidak ditemukan, memakai pemeriksaan isi zip"
            unzip -l "$APK" | grep -Ei "ic_launcher" || true
            for f in res/mipmap-xxxhdpi/ic_launcher.png res/mipmap-xxxhdpi/ic_launcher_foreground.png; do
              unzip -l "$APK" | grep -q "$f" || { echo "::error::${{ matrix.app }}: $f tidak ada"; exit 1; }
            done
          fi

          echo "✅ Ikon launcher terverifikasi di ${{ matrix.app }}"

      - name: Rename APK
        run: |
          mv apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk \
             ${{ matrix.app }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: ${{ matrix.app }}.apk
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all APKs
        uses: actions/download-artifact@v4
        with:
          path: apks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apks/**/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
