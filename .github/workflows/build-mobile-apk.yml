# ============================================================================
# Build mobile APKs (4 apps: wali, guru, bendahara, kepala)
# ============================================================================
# Trigger: manual (workflow_dispatch) — pick which app(s) to build.
# No external quota needed (uses GitHub Actions ubuntu-latest free tier).
# ============================================================================

name: Build Mobile APK

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App to build"
        required: true
        type: choice
        default: mobile_wali
        options:
          - mobile_wali
          - mobile_guru
          - mobile_bendahara
          - mobile_kepala
          - all
  push:
    branches:
      - main
    paths:
      - "apps/mobile_*/**"
      - "packages/**"
      - ".github/workflows/build-mobile-apk.yml"

concurrency:
  group: mobile-apk-${{ github.ref }}-${{ inputs.app || 'all' }}
  cancel-in-progress: true

jobs:
  resolve-apps:
    name: Resolve target apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.expand.outputs.apps }}
    steps:
      - id: expand
        run: |
          INPUT="${{ inputs.app || 'all' }}"
          if [ "$INPUT" = "all" ]; then
            echo 'apps=["mobile_wali","mobile_guru","mobile_bendahara","mobile_kepala"]' >> "$GITHUB_OUTPUT"
          else
            echo "apps=[\"$INPUT\"]" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build APK — ${{ matrix.app }}
    needs: resolve-apps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.resolve-apps.outputs.apps) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.6.2"

      - name: Install melos
        run: dart pub global activate melos 6.3.2

      - name: Bootstrap workspace
        working-directory: .
        run: |
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          melos bootstrap

      - name: Generate code (freezed/json/riverpod)
        working-directory: .
        run: |
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          melos run gen || echo "No gen script configured, skipping"

      - name: Build APK
        run: flutter build apk --release --verbose

      - name: Find APK
        id: find-apk
        run: |
          APK_PATH=$(find build/app/outputs/flutter-apk -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ No APK found!"
            exit 1
          fi
          APK_NAME=$(basename "$APK_PATH")
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "✅ Found APK: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: apps/${{ matrix.app }}/${{ steps.find-apk.outputs.apk_path }}
          retention-days: 30
          compression-level: 0

      - name: Summary
        working-directory: .
        run: |
          echo "## 📱 APK Built — ${{ matrix.app }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **App**: \`${{ matrix.app }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Build**: Release APK (Flutter)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Artifact**: \`${{ steps.find-apk.outputs.apk_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download APK dari Artifacts section di atas." >> "$GITHUB_STEP_SUMMARY"
