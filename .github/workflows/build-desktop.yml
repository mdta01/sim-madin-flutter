# ============================================================================
# Build admin desktop binaries (Windows, macOS, Linux)
# ============================================================================
# Trigger: manual (workflow_dispatch) — pick which platform to build.
# Note: macOS runs on macos-latest, Windows on windows-latest, Linux on ubuntu-latest.
# ============================================================================

name: Build Admin Desktop

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform"
        required: true
        type: choice
        default: linux
        options:
          - windows
          - macos
          - linux
          - all
  push:
    branches:
      - main
    paths:
      - "apps/admin_desktop/**"
      - "packages/**"
      - ".github/workflows/build-desktop.yml"

concurrency:
  group: desktop-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true

jobs:
  resolve-platforms:
    name: Resolve target platforms
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.expand.outputs.platforms }}
    steps:
      - id: expand
        run: |
          INPUT="${{ inputs.platform || 'all' }}"
          if [ "$INPUT" = "all" ]; then
            echo 'platforms=[{"os":"ubuntu-latest","target":"linux"},{"os":"windows-latest","target":"windows"},{"os":"macos-latest","target":"macos"}]' >> "$GITHUB_OUTPUT"
          else
            case "$INPUT" in
              linux)   OS="ubuntu-latest" ;;
              windows) OS="windows-latest" ;;
              macos)   OS="macos-latest" ;;
            esac
            echo "platforms=[{\"os\":\"$OS\",\"target\":\"$INPUT\"}]" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Desktop — ${{ matrix.target }}
    needs: resolve-platforms
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve-platforms.outputs.platforms) }}
    defaults:
      run:
        working-directory: apps/admin_desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.6.2"

      - name: Install melos
        run: dart pub global activate melos 6.3.2

      - name: Bootstrap workspace
        working-directory: .
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="$PATH;$USERPROFILE\.pub-cache\bin"
          else
            export PATH="$PATH:$HOME/.pub-cache/bin"
          fi
          melos bootstrap

      - name: Generate code (freezed/json/riverpod)
        working-directory: .
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="$PATH;$USERPROFILE\.pub-cache\bin"
          else
            export PATH="$PATH:$HOME/.pub-cache/bin"
          fi
          melos run gen || echo "No gen script configured, skipping"

      - name: Enable desktop support
        run: |
          flutter config --enable-linux-desktop
          flutter config --enable-macos-desktop
          flutter config --enable-windows-desktop

      - name: Install Linux build deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libstdc++-12-dev clang cmake \
            libsecret-1-dev libjsoncpp-dev libcurl4-openssl-dev

      - name: Build desktop app
        run: flutter build ${{ matrix.target }} --release

      - name: Find artifact (Linux)
        if: matrix.target == 'linux'
        id: find-linux
        run: |
          BINARY=$(find build/linux/x64/release/bundle -type f -name "admin_desktop" -executable | head -1)
          echo "binary_path=$BINARY" >> $GITHUB_OUTPUT
          ls -la build/linux/x64/release/bundle/

      - name: Find artifact (macOS)
        if: matrix.target == 'macos'
        id: find-macos
        run: |
          APP=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -1)
          echo "app_path=$APP" >> $GITHUB_OUTPUT
          ls -la build/macos/Build/Products/Release/

      - name: Find artifact (Windows)
        if: matrix.target == 'windows'
        id: find-windows
        shell: bash
        run: |
          EXE=$(find build/windows/x64/runner/Release -name "*.exe" -maxdepth 1 | head -1)
          echo "exe_path=$EXE" >> $GITHUB_OUTPUT
          ls -la build/windows/x64/runner/Release/

      - name: Upload artifact (Linux)
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: admin_desktop-linux
          path: apps/admin_desktop/build/linux/x64/release/bundle
          retention-days: 30

      - name: Upload artifact (macOS)
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: admin_desktop-macos
          path: apps/admin_desktop/build/macos/Build/Products/Release/*.app
          retention-days: 30

      - name: Upload artifact (Windows)
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: admin_desktop-windows
          path: apps/admin_desktop/build/windows/x64/runner/Release
          retention-days: 30

      - name: Summary
        working-directory: .
        run: |
          echo "## 🖥️ Desktop Built — ${{ matrix.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Platform**: ${{ matrix.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **App**: admin_desktop" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download binary dari Artifacts section di atas." >> "$GITHUB_STEP_SUMMARY"
