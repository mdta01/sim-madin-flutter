# ============================================================================
# Build admin desktop binaries (Windows ONLY — Phase 6)
# ============================================================================
# Phase 6 simplification: hanya build untuk Windows.
# macOS/Linux builds di-skip untuk menghemat CI time.
# Kalau nanti butuh macOS/Linux, tinggal uncomment matrix entries.
# ============================================================================

name: Build Admin Desktop

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform (default: windows)"
        required: true
        type: choice
        default: windows
        options:
          - windows
  push:
    branches:
      - main
    paths:
      - "apps/admin_desktop/**"
      - "packages/**"
      - ".github/workflows/build-desktop.yml"

concurrency:
  group: desktop-${{ github.ref }}-${{ inputs.platform || 'windows' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Desktop — Windows
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/admin_desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.6.2"

      - name: Install melos
        run: dart pub global activate melos 6.3.2

      - name: Bootstrap workspace
        working-directory: .
        shell: pwsh
        run: |
          $env:PATH = "$env:LOCALAPPDATA\Pub\Cache\bin;$env:USERPROFILE\.pub-cache\bin;$env:PATH"
          melos bootstrap

      - name: Generate code (freezed/json/riverpod) — skip if no gen script
        working-directory: .
        shell: pwsh
        run: |
          $env:PATH = "$env:LOCALAPPDATA\Pub\Cache\bin;$env:USERPROFILE\.pub-cache\bin;$env:PATH"
          # melos run gen will fail if build_runner not in deps — that's OK
          # for this project (we use plain Dart classes, no codegen).
          # Capture output + always exit 0 so CI doesn't fail on this step.
          & {
            $ErrorActionPreference = 'SilentlyContinue'
            melos run gen 2>&1
          }
          Write-Host "gen step completed (errors ignored — no codegen needed)"
          exit 0

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Install VS 2022 BuildTools + remove VS 18 (force Flutter to use VS 2022)
        shell: pwsh
        run: |
          # Install VS 2022 Build Tools with C++ workload
          choco install visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --passive --norestart" --no-progress --limit-output
          
          # CRITICAL: Remove VS 18 (2026) from runner so vswhere only finds VS 2022.
          # Flutter 3.27.4 hardcodes "Visual Studio 16 2019" CMake generator.
          # VS 18 doesn't support that generator, but VS 2022 does.
          $vs18Path = "C:\Program Files\Microsoft Visual Studio\18"
          if (Test-Path $vs18Path) {
            Write-Host "Removing VS 18 (2026) to force vswhere to pick VS 2022..."
            Remove-Item -Recurse -Force $vs18Path -ErrorAction SilentlyContinue
          }
          
          # Verify only VS 2022 is visible
          $vsList = & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -format value -products * -property installationPath
          Write-Host "VS installations found:"
          Write-Host $vsList

      - name: Build Windows app
        run: flutter build windows --release

      - name: Find artifact (Windows)
        id: find-windows
        shell: bash
        run: |
          EXE=$(find build/windows/x64/runner/Release -name "*.exe" -maxdepth 1 | head -1)
          echo "exe_path=$EXE" >> $GITHUB_OUTPUT
          ls -la build/windows/x64/runner/Release/

      - name: Upload artifact (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: admin_desktop-windows
          path: apps/admin_desktop/build/windows/x64/runner/Release
          retention-days: 30

      - name: Summary
        working-directory: .
        run: |
          echo "## 🖥️ Desktop Built — Windows" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Platform**: Windows (x64)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **App**: admin_desktop" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download binary dari Artifacts section di atas." >> "$GITHUB_STEP_SUMMARY"
