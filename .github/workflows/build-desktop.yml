# ============================================================================
# Build admin desktop binaries (Windows ONLY — Phase 6)
# ============================================================================
# Catatan: desktop CI build saat ini FAIL karena GitHub Actions windows-latest
# runner punya VS 2026 (v18) pre-installed yang tidak compatible dengan
# Flutter 3.27.4 CMake generator ("Visual Studio 16 2019").
#
# Workaround: build Windows exe locally:
#   1. Install Flutter 3.27.4 + Visual Studio 2022 dengan C++ workload
#   2. cd apps/admin_desktop
#   3. flutter build windows --release
#   4. Binary ada di build/windows/x64/runner/Release/
#
# CI trigger: manual only (workflow_dispatch). Push ke main tidak trigger
# desktop build supaya tidak block PR/mobile builds.
# ============================================================================

name: Build Admin Desktop

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform (default: windows)"
        required: true
        type: choice
        default: windows
        options:
          - windows

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Desktop — Windows
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true  # Don't fail the workflow if desktop build fails
    defaults:
      run:
        working-directory: apps/admin_desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.6.2"

      - name: Install melos
        run: dart pub global activate melos 6.3.2

      - name: Bootstrap workspace
        working-directory: .
        shell: pwsh
        run: |
          $env:PATH = "$env:LOCALAPPDATA\Pub\Cache\bin;$env:USERPROFILE\.pub-cache\bin;$env:PATH"
          melos bootstrap

      - name: Generate code — skip if no gen script
        working-directory: .
        shell: pwsh
        run: |
          $env:PATH = "$env:LOCALAPPDATA\Pub\Cache\bin;$env:USERPROFILE\.pub-cache\bin;$env:PATH"
          & {
            $ErrorActionPreference = 'SilentlyContinue'
            melos run gen 2>&1
          }
          Write-Host "gen step completed (errors ignored)"
          exit 0

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Install VS 2022 BuildTools (C++ workload)
        shell: pwsh
        run: |
          choco install visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --passive --norestart" --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { Write-Host "VS 2022 install returned $LASTEXITCODE" }

      - name: Build Windows app
        shell: pwsh
        run: |
          # Try to force CMake to use VS 2022 instead of VS 18 (2026).
          $vs2022 = & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -format value -products * -latest -version "[17.0,18.0)" -property installationPath
          if ($vs2022) {
            $env:CMAKE_GENERATOR = "Visual Studio 17 2022"
            $env:CMAKE_GENERATOR_INSTANCE = $vs2022
            Write-Host "Using VS 2022 at: $vs2022"
          }
          flutter build windows --release

      - name: Find artifact (Windows)
        if: success()
        id: find-windows
        shell: bash
        run: |
          EXE=$(find build/windows/x64/runner/Release -name "*.exe" -maxdepth 1 | head -1)
          echo "exe_path=$EXE" >> $GITHUB_OUTPUT
          ls -la build/windows/x64/runner/Release/ || echo "No Release folder found"

      - name: Upload artifact (Windows)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: admin_desktop-windows
          path: apps/admin_desktop/build/windows/x64/runner/Release
          retention-days: 30
          if-no-files-found: ignore

      - name: Summary
        if: always()
        working-directory: .
        shell: bash
        run: |
          echo "## 🖥️ Desktop Build — Windows" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Build sukses! Download dari Artifacts." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Build gagal — known issue dengan VS 18 (2026) di runner." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Workaround**: build locally:" >> "$GITHUB_STEP_SUMMARY"
            echo '```bash' >> "$GITHUB_STEP_SUMMARY"
            echo "cd apps/admin_desktop" >> "$GITHUB_STEP_SUMMARY"
            echo "flutter build windows --release" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
