name: mobile_kepala
description: "SIM MADIN - Kepala Madrasah. Mobile app untuk kepala (dashboard analitik, monitor read-only)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Shared packages dari monorepo
  shared:
    path: ../../packages/shared
  supabase_client:
    path: ../../packages/supabase_client
  api_client:
    path: ../../packages/api_client

  # State management & routing
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.0

  # Supabase & networking
  supabase_flutter: ^2.8.0
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1
  dio: ^5.7.0

  # Storage & utils
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  uuid: ^4.5.1

  # UI / UX
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  fl_chart: ^0.69.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.3
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/logo-madrasah.png
    - assets/icons/
