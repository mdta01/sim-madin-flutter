name: shared
description: Shared code untuk SIM MADIN Flutter monorepo. Berisi models, theme, constants, dan utils yang dipakai semua apps.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # State management & serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  collection: ^1.18.0
  # Logging
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  lints: ^5.0.0
  test: ^1.25.0
