name: api_client
description: API client wrapper untuk SIM MADIN Flutter. Talks to Serverpod backend. Includes auth (admin email/pass + wali WA+PIN), Riverpod providers.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  shared:
    path: ../shared
  supabase_client:
    path: ../supabase_client
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  dio: ^5.7.0
  supabase_flutter: ^2.8.0
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1
  flutter_secure_storage: ^9.2.2
  go_router: ^14.6.0
  uuid: ^4.5.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.3
  riverpod_lint: ^2.6.3
  lints: ^5.0.0
